[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onecmcp"
version = "0.10.0"
description = "Протокольный шлюз 1cmcp: MCP и REST к адаптеру 1С"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Стас Чашин", email = "Stas@Chashin.pro" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.4.0",
  "uvicorn[standard]>=0.32.0",
  "mcp>=2.2.0",
  "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "openapi-spec-validator>=0.7.1",
  "pyyaml>=6.0.2",
]
otel = [
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.scripts]
onecmcp = "onecmcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onecmcp = ["presets/data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["../tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
