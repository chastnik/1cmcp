services:
  mock1c:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: python -m onecmcp mock1c --host 0.0.0.0 --port 18080
    ports:
      - "18080:18080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/v1/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 8

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: python -m onecmcp serve --host 0.0.0.0 --port 8000
    environment:
      GATEWAY_DATA_DIR: /var/lib/onecmcp
      ADMIN_BOOTSTRAP_TOKEN: dev-admin
      ONEC_BASE_URL: http://mock1c:18080
      ONEC_TOKEN: dev-token
    volumes:
      - gateway-data:/var/lib/onecmcp
    ports:
      - "8000:8000"
    depends_on:
      mock1c:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 8

volumes:
  gateway-data:
